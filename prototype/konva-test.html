<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <title>Prototipe Canvas</title>
        <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
    </head>
    <body>
        <div id="container"></div>
        <button id="btn-export">Export PNG</button>

        <script>
            // Panggung dan layer
            const stage = new Konva.Stage({
                container: "container",
                width: 600,
                height: 400,
            });
            const layer = new Konva.Layer();
            stage.add(layer);

            // Latar abu-abu
            const bg = new Konva.Rect({
                x: 0, y: 0, width: 600, height: 400, fill: "#f3f3f3",
            });

            // Area desain (batas yang boleh dipakai)
            const area = { x: 50, y: 50, width: 500, height: 300 };
            const areaRect = new Konva.Rect({
                ...area,
                stroke: "#888888",
                dash: [6, 4],
                listening: false,
            });

            // Teks
            const text = new Konva.Text({
                x: 100, y: 150,
                text: "Halo Konva",
                fontSize: 40,
                fill: "#222222",
                draggable: true,
            });

            layer.add(bg);
            layer.add(areaRect);
            layer.add(text);

            // Transformer (resize dan rotate)
            const tr = new Konva.Transformer({
                nodes: [text],
                keepRatio: true,
                rotateEnabled: true,
                boundBoxFunc: (oldBox, newBox) => {
                    if (newBox.width > area.width || newBox.height > area.height) {
                        return oldBox;
                    }
                    return newBox;
                },
            });
            layer.add(tr);

            // Klik objek untuk memilih, klik area kosong untuk batal pilih
            stage.on("click tap", function (e) {
                if (e.target === stage || e.target === bg) {
                    tr.nodes([]);
                } else {
                    tr.nodes([e.target]);
                }
            });

            // Dorong objek kembali ke dalam area kalau keluar
            function keepInside(node) {
                const box = node.getClientRect();
                let dx = 0, dy = 0;
                if (box.x < area.x) dx = area.x - box.x;
                if (box.y < area.y) dy = area.y - box.y;
                if (box.x + box.width > area.x + area.width)
                    dx = area.x + area.width - (box.x + box.width);
                if (box.y + box.height > area.y + area.height)
                    dy = area.y + area.height - (box.y + box.height);
                node.x(node.x() + dx);
                node.y(node.y() + dy);
            }
            text.on("dragmove transform", () => keepInside(text));

            // Export PNG
            document.getElementById("btn-export").addEventListener("click", () => {
                // Sembunyikan alat bantu supaya tidak ikut ter-export
                tr.visible(false);
                areaRect.visible(false);

                // Ambil hanya area desain, resolusi 2x
                const dataURL = stage.toDataURL({
                    x: area.x,
                    y: area.y,
                    width: area.width,
                    height: area.height,
                    pixelRatio: 2,
                });

                // Munculkan lagi
                tr.visible(true);
                areaRect.visible(true);

                // Unduh sebagai file
                const link = document.createElement("a");
                link.download = "desain.png";
                link.href = dataURL;
                link.click();
            });
        </script>
    </body>
</html>
